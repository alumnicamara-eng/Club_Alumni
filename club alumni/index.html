<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alumni Comunidad - Calendario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    :root {
      --primary: #46c2a8;
      --primary-dark: #3aa18b;
      --bg: #f8fafd;
      --text-main: #1e293b;
      --text-muted: #94a3b8;
      --white: #ffffff;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
      --border-light: #edf2f7;
    }

    body {
      background-color: #dce3ef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 375px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      border: 8px solid white;
    }

    @media (max-width: 400px) {
      .mobile-container {
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    .status-bar {
      padding: 14px 28px 4px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      background-color: var(--bg);
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    header {
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      background: white;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .brand-logo img {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      object-fit: cover;
    }
    
    .brand-text {
      color: var(--primary);
      font-weight: 800;
      font-size: 13px;
    }

    /* Campana de notificaciones - blanco y negro sin relleno */
    .bell-container {
      position: relative;
      cursor: pointer;
    }
    .bell-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bell-icon svg {
      width: 20px;
      height: 20px;
      stroke: #64748b;
      stroke-width: 1.8;
      fill: none;
    }
    .bell-container:active .bell-icon svg {
      transform: scale(0.9);
    }
    .notification-badge {
      position: absolute;
      top: -5px;
      right: -8px;
      background: #f43f5e;
      color: white;
      font-size: 9px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .notification-badge.hidden {
      display: none;
    }

    .notification-panel {
      position: absolute;
      top: 55px;
      right: 10px;
      width: 280px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      z-index: 50;
      display: none;
      max-height: 300px;
      overflow-y: auto;
    }
    .notification-panel.show {
      display: block;
      animation: fadeInDown 0.2s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .notification-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-main);
    }
    .notification-list {
      padding: 8px 0;
    }
    .notification-item {
      padding: 10px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 11px;
      color: var(--text-main);
    }
    .notification-item strong {
      color: var(--primary);
    }
    .notification-empty {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 90px;
    }

    /* Calendario */
    .calendar-table {
      background: white;
      border-radius: 20px;
      padding: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 700;
      font-size: 13px;
    }

    .month-nav {
      cursor: pointer;
      font-size: 15px;
      color: var(--text-muted);
      padding: 0 6px;
    }
    .month-nav:active { transform: scale(0.9); }

    .month-title {
      font-weight: 700;
      color: var(--text-main);
      font-size: 13px;
    }

    .today-badge {
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 16px;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 8px;
    }

    .weekday {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .cal-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
    }

    .cal-day {
      font-size: 11px;
      padding: 7px 0;
      border-radius: 12px;
      color: #475569;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .cal-day:active { transform: scale(0.95); background: #eef2ff; }
    .cal-day.other-month { color: #cbd5e1; }
    .cal-day.today { background: var(--primary); color: white; font-weight: 700; }
    .cal-day.has-event::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      background: var(--primary);
      border-radius: 50%;
    }

    .events-section-title {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 12px 0 10px 0;
    }

    .event-item {
      background: white;
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      border-left: 3px solid var(--primary);
    }

    .event-info h4 {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
    }
    .event-info p {
      font-size: 9px;
      color: var(--text-muted);
    }

    .delete-event {
      color: #cbd5e1;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 20px;
    }

    .empty-events {
      background: white;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .empty-events p {
      color: #94a3b8;
      font-size: 11px;
    }

    /* Botones de conexión con logos blanco y negro sin relleno */
    .connection-buttons {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-connect {
      width: 100%;
      padding: 10px;
      border-radius: 24px;
      border: 1.5px solid #e2e8f0;
      background: white;
      color: #1e293b;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-connect:active { transform: scale(0.97); background: #f8fafc; }
    
    .connect-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .connect-icon svg {
      width: 16px;
      height: 16px;
      stroke: #475569;
      stroke-width: 1.5;
      fill: none;
    }

    /* Áreas */
    .areas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .areas-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .btn-add-area {
      background: var(--primary);
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      color: white;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-add-area:active { transform: scale(0.95); }

    .area-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .area-card {
      background: white;
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      border-left: 3px solid var(--primary);
    }

    .area-name {
      font-weight: 500;
      font-size: 12px;
      color: var(--text-main);
    }

    .btn-delete-area {
      background: none;
      border: none;
      color: #f43f5e;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 20px;
    }

    /* Buscador */
    .search-box {
      background: white;
      border-radius: 28px;
      padding: 6px 14px;
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .search-box input { flex: 1; border: none; padding: 10px 0; outline: none; font-size: 11px; background: transparent; }
    .search-box button { background: var(--primary); border: none; padding: 6px 16px; border-radius: 30px; color: white; font-weight: 600; font-size: 11px; cursor: pointer; }

    .suggest-chip {
      background: #f1f5f9;
      padding: 5px 12px;
      border-radius: 24px;
      font-size: 10px;
      cursor: pointer;
    }

    /* Modales */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      backdrop-filter: blur(3px);
    }

    .modal-content {
      background: white;
      width: 100%;
      padding: 20px 20px 28px;
      border-radius: 28px 28px 0 0;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-content h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .modal-content input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1.5px solid #e2e8f0;
      margin-bottom: 12px;
      font-size: 13px;
      outline: none;
    }
    .modal-content input:focus { border-color: var(--primary); }

    .row-2 { display: flex; gap: 12px; margin-bottom: 12px; }
    .row-2 input { flex: 1; margin-bottom: 0; }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 11px;
      border-radius: 28px;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }
    .modal-buttons button:active { transform: scale(0.97); }
    .btn-cancel { background: #f1f5f9; color: #64748b; }
    .btn-create { background: var(--primary); color: white; }

    /* FAB */
    .fab-create {
      position: absolute;
      bottom: 90px;
      right: 20px;
      width: 52px;
      height: 52px;
      background: var(--primary);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 26px;
      font-weight: 500;
      box-shadow: 0 6px 16px rgba(70, 194, 168, 0.4);
      cursor: pointer;
      z-index: 15;
      border: none;
    }
    .fab-create:active { transform: scale(0.92); }

    /* Navegación inferior - logos blanco y negro sin relleno */
    nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .nav-item:active { transform: scale(0.95); background: #f1f5f9; }
    .nav-item.active { color: var(--primary); }
    
    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }
    .nav-item.active .nav-icon svg {
      stroke: var(--primary);
    }

    .toast-msg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 10px;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast-show { opacity: 1; animation: fadeOut 2s forwards; }
    @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>
<div class="mobile-container">
  <div class="status-bar">
    <div class="status-left"><span id="currentTime">--:--</span></div>
    <div class="status-right"><span>📶</span><span>🔋</span></div>
  </div>
  <header>
    <div class="brand">
      <div class="brand-logo">
        <img src="./logo.jpeg" alt="Logo Comunidad Alumni">
        <span class="brand-text">Comunidad Alumni</span>
      </div>
    </div>
    <div class="bell-container" id="bellContainer">
      <div class="bell-icon">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" fill="none"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" fill="none"/>
        </svg>
      </div>
      <div class="notification-badge hidden" id="notificationBadge">0</div>
    </div>
  </header>

  <div class="notification-panel" id="notificationPanel">
    <div class="notification-header">Notificaciones</div>
    <div class="notification-list" id="notificationList"></div>
  </div>

  <div class="main-content" id="mainContent"></div>

  <button class="fab-create" id="fabCreateBtn">+</button>

  <!-- Navegación con logos blanco y negro sin relleno -->
  <nav>
    <div class="nav-item" data-tab="calendar">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" fill="none"/>
          <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor"/>
          <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor"/>
          <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor"/>
          <circle cx="12" cy="15" r="1" fill="currentColor"/>
          <circle cx="16" cy="15" r="1" fill="currentColor"/>
          <circle cx="8" cy="15" r="1" fill="currentColor"/>
        </svg>
      </div>
      <span>Calendario</span>
    </div>
    <div class="nav-item" data-tab="areas">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none">
          <circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/>
          <path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" fill="none"/>
        </svg>
      </div>
      <span>Áreas</span>
    </div>
    <div class="nav-item" data-tab="search">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" fill="none"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor"/>
        </svg>
      </div>
      <span>Buscar</span>
    </div>
  </nav>

  <!-- Modal Crear Evento -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-content">
      <h3>➕ Crear evento</h3>
      <input type="text" id="eventTitle" placeholder="Nombre del evento *">
      <div class="row-2">
        <input type="number" id="eventDay" placeholder="Día (1-31)" min="1" max="31">
        <input type="time" id="eventTime" value="18:00">
      </div>
      <input type="text" id="eventPlace" placeholder="Ubicación (ej: Aula 302)">
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeEventModal()">Cancelar</button>
        <button class="btn-create" onclick="createNewEvent()">Crear</button>
      </div>
    </div>
  </div>

  <!-- Modal Nueva Área -->
  <div class="modal-overlay" id="areaModal">
    <div class="modal-content">
      <h3>➕ Nueva área de interés</h3>
      <input type="text" id="newAreaName" placeholder="Ej: Data Science, IA, Marketing Digital">
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeAreaModal()">Cancelar</button>
        <button class="btn-create" onclick="addNewArea()">Agregar</button>
      </div>
    </div>
  </div>
</div>

<div id="toastMessage" class="toast-msg"></div>

<script>
  // Hora automática
  function updateClock() {
    const now = new Date();
    document.getElementById('currentTime').textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  }
  updateClock();
  setInterval(updateClock, 60000);

  let currentTab = 'calendar';
  let currentYear = 2026, currentMonth = 3;
  let eventsList = [];
  let areasList = ['Tecnología', 'Marketing', 'Finanzas', 'RRHH', 'Ventas', 'Innovación'];
  let recentSearches = ['María González', 'juan.perez@empresa.com', 'Marketing', 'Desarrollo de Software'];

  function showToast(msg) {
    const toast = document.getElementById('toastMessage');
    toast.innerText = msg;
    toast.classList.remove('toast-show');
    void toast.offsetWidth;
    toast.classList.add('toast-show');
    setTimeout(() => toast.classList.remove('toast-show'), 2000);
  }

  // Notificaciones
  function getUpcomingEvents() {
    const today = new Date();
    return eventsList.filter(ev => {
      const evDate = new Date(ev.year, ev.month, ev.date);
      const diffDays = (evDate - today) / (1000 * 60 * 60 * 24);
      return diffDays >= 0 && diffDays <= 1;
    });
  }
  function updateNotifications() {
    const upcoming = getUpcomingEvents();
    const badge = document.getElementById('notificationBadge');
    const listContainer = document.getElementById('notificationList');
    if (upcoming.length > 0) {
      badge.textContent = upcoming.length;
      badge.classList.remove('hidden');
      listContainer.innerHTML = upcoming.map(ev => `
        <div class="notification-item">
          <strong>🔔 ${escapeHtml(ev.title)}</strong><br>
          📅 ${ev.date} · ⏰ ${ev.time}<br>📍 ${ev.place || 'Sin ubicación'}
        </div>
      `).join('');
    } else {
      badge.classList.add('hidden');
      listContainer.innerHTML = '<div class="notification-empty">📭 No hay notificaciones</div>';
    }
  }
  function toggleNotifications() {
    document.getElementById('notificationPanel').classList.toggle('show');
    updateNotifications();
  }
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('notificationPanel');
    const bell = document.getElementById('bellContainer');
    if (panel && !panel.contains(e.target) && !bell.contains(e.target)) panel.classList.remove('show');
  });

  function saveEvents() { localStorage.setItem('alumni_events', JSON.stringify(eventsList)); updateNotifications(); }
  function loadEvents() {
    const stored = localStorage.getItem('alumni_events');
    eventsList = stored ? JSON.parse(stored) : [];
    updateNotifications();
  }
  function saveAreas() { localStorage.setItem('alumni_areas', JSON.stringify(areasList)); }
  function loadAreas() { const s = localStorage.getItem('alumni_areas'); if(s) areasList = JSON.parse(s); }
  function saveRecent() { localStorage.setItem('alumni_recent', JSON.stringify(recentSearches)); }
  function loadRecent() { const s = localStorage.getItem('alumni_recent'); if(s) recentSearches = JSON.parse(s); }

  // Calendario
  function renderCalendarPanel() {
    const container = document.getElementById('mainContent');
    const monthNames = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const today = new Date();
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const prevDays = new Date(currentYear, currentMonth, 0).getDate();
    
    let html = `<div class="calendar-table"><div class="calendar-header">
      <span class="month-nav" id="prevMonthBtn">❮</span>
      <span class="month-title">${monthNames[currentMonth]} de ${currentYear}</span>
      <span class="today-badge" id="todayBtn">Hoy</span>
      <span class="month-nav" id="nextMonthBtn">❯</span>
    </div><div class="cal-weekdays">${['dom','lun','mar','mié','jue','vie','sáb'].map(d => `<div class="weekday">${d}</div>`).join('')}</div>
    <div class="cal-days-grid" id="daysGrid"></div></div>
    <div class="events-section-title">📌 Próximos eventos</div><div id="eventsListContainer"></div>
    <div class="connection-buttons">
      <a href="https://calendar.google.com/calendar/r" target="_blank" class="btn-connect">
        <span class="connect-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
        Conectar Google Calendario
      </a>
      <a href="https://www.icloud.com/calendar" target="_blank" class="btn-connect">
        <span class="connect-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17.36 3 12.98 5.4 9.77c1.2-1.59 3.06-2.5 4.81-2.53 1.5-.03 2.92.99 3.84.99.91 0 2.63-1.22 4.43-.98.75.03 2.87.3 4.23 2.27-.11.07-2.52 1.47-2.49 4.37.03 2.49 2.17 3.32 2.2 3.33-.02.05-.34 1.16-1.12 2.3zM15.08 3.92c.68-.83 1.14-1.97.99-3.12-.97.05-2.13.64-2.81 1.44-.62.72-1.05 1.71-.91 2.71 1.02.08 2.07-.52 2.73-1.03z"/></svg></span>
        Conectar Calendario de Apple
      </a>
    </div>`;
    container.innerHTML = html;
    
    const daysGrid = document.getElementById('daysGrid');
    let daysHtml = '';
    for (let i = 0; i < firstDay; i++) daysHtml += `<div class="cal-day other-month">${prevDays - firstDay + i + 1}</div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const hasEvent = eventsList.some(ev => ev.date === d && ev.month === currentMonth && ev.year === currentYear);
      const isToday = (today.getFullYear() === currentYear && today.getMonth() === currentMonth && d === today.getDate());
      daysHtml += `<div class="cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}" data-day="${d}">${d}</div>`;
    }
    const total = Math.ceil((firstDay + daysInMonth) / 7) * 7;
    for (let i = 1; i <= total - (firstDay + daysInMonth); i++) daysHtml += `<div class="cal-day other-month">${i}</div>`;
    daysGrid.innerHTML = daysHtml;
    
    const filtered = eventsList.filter(ev => ev.month === currentMonth && ev.year === currentYear).sort((a,b)=>a.date-b.date);
    const eventsDiv = document.getElementById('eventsListContainer');
    if (filtered.length === 0) eventsDiv.innerHTML = `<div class="empty-events"><p>📭 No hay eventos para este mes</p></div>`;
    else {
      eventsDiv.innerHTML = filtered.map(ev => `<div class="event-item"><div class="event-info"><h4>${escapeHtml(ev.title)}</h4><p>${ev.date} ${monthNames[currentMonth]} · ${ev.time} · ${ev.place || 'Sin ubicación'}</p></div><div class="delete-event" data-id="${ev.id}">✕</div></div>`).join('');
      document.querySelectorAll('.delete-event').forEach(el => {
        el.addEventListener('click', (e) => {
          const id = parseInt(el.dataset.id);
          eventsList = eventsList.filter(ev => ev.id !== id);
          saveEvents();
          renderCalendarPanel();
          showToast('Evento eliminado');
        });
      });
    }
    document.querySelectorAll('.cal-day[data-day]').forEach(day => {
      day.addEventListener('click', () => { document.getElementById('eventDay').value = day.dataset.day; openEventModal(); });
    });
    document.getElementById('prevMonthBtn')?.addEventListener('click', () => changeMonth(-1));
    document.getElementById('nextMonthBtn')?.addEventListener('click', () => changeMonth(1));
    document.getElementById('todayBtn')?.addEventListener('click', () => { const d=new Date(); currentYear=d.getFullYear(); currentMonth=d.getMonth(); renderCalendarPanel(); showToast('Mes actual'); });
  }

  function changeMonth(delta) {
    let nm = currentMonth + delta, ny = currentYear;
    if (nm < 0) { nm = 11; ny--; }
    else if (nm > 11) { nm = 0; ny++; }
    currentMonth = nm; currentYear = ny;
    renderCalendarPanel();
  }

  function createNewEvent() {
    const title = document.getElementById('eventTitle').value.trim();
    let day = parseInt(document.getElementById('eventDay').value);
    const time = document.getElementById('eventTime').value;
    let place = document.getElementById('eventPlace').value.trim();
    if (!title) { showToast('Título requerido'); return; }
    const max = new Date(currentYear, currentMonth+1, 0).getDate();
    if (isNaN(day) || day < 1 || day > max) { showToast(`Día inválido (1-${max})`); return; }
    if (!place) place = 'Sin ubicación';
    eventsList.push({ id: Date.now(), title, date: day, time, place, month: currentMonth, year: currentYear });
    saveEvents();
    closeEventModal();
    renderCalendarPanel();
    showToast(`✅ Evento "${title}" creado`);
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventPlace').value = '';
  }

  function openEventModal() { document.getElementById('eventModal').style.display = 'flex'; const d=new Date(); if(currentYear===d.getFullYear()&&currentMonth===d.getMonth()) document.getElementById('eventDay').value=d.getDate(); }
  function closeEventModal() { document.getElementById('eventModal').style.display = 'none'; }

  // Áreas
  function openAreaModal() { document.getElementById('areaModal').style.display = 'flex'; }
  function closeAreaModal() { document.getElementById('areaModal').style.display = 'none'; }
  function addNewArea() {
    const newArea = document.getElementById('newAreaName').value.trim();
    if (!newArea) { showToast('Escribe un nombre'); return; }
    areasList.push(newArea);
    saveAreas();
    closeAreaModal();
    if (currentTab === 'areas') renderAreasPanel();
    showToast(`✅ Área "${newArea}" añadida`);
  }

  function renderAreasPanel() {
    const container = document.getElementById('mainContent');
    container.innerHTML = `
      <div class="areas-header">
        <h2>Áreas de Interés</h2>
        <button class="btn-add-area" id="addAreaBtn">+ Nueva área</button>
      </div>
      <div class="area-list" id="areasListContainer"></div>
    `;
    const areasDiv = document.getElementById('areasListContainer');
    if (areasList.length === 0) areasDiv.innerHTML = `<div class="empty-events"><p>Sin áreas de interés</p></div>`;
    else {
      areasDiv.innerHTML = areasList.map(area => `<div class="area-card"><span class="area-name">${escapeHtml(area)}</span><button class="btn-delete-area" data-area="${escapeHtml(area)}">Eliminar</button></div>`).join('');
      document.querySelectorAll('.btn-delete-area').forEach(btn => {
        btn.addEventListener('click', () => {
          const areaVal = btn.getAttribute('data-area');
          areasList = areasList.filter(a => a !== areaVal);
          saveAreas();
          renderAreasPanel();
          showToast(`Área "${areaVal}" eliminada`);
        });
      });
    }
    document.getElementById('addAreaBtn')?.addEventListener('click', openAreaModal);
  }

  // Buscador
  function performSearch(q) {
    if (!q.trim()) { showToast('Escribe algo para buscar'); return; }
    recentSearches = [q, ...recentSearches.filter(t => t !== q)].slice(0, 6);
    saveRecent();
    showToast(`🔍 Buscando: "${q}"`);
    setTimeout(() => alert(`🔍 Resultados para: "${q}"\n(Simulación - Conectar con API real)`), 100);
    if (currentTab === 'search') renderSearchPanel();
  }

  function renderSearchPanel() {
    const container = document.getElementById('mainContent');
    container.innerHTML = `
      <div class="search-box"><input type="text" id="searchInput" placeholder="Buscar por nombre, email o área..."><button id="searchExecBtn">Buscar</button></div>
      <div class="events-section-title">BÚSQUEDAS RECIENTES</div><div id="recentSearchList"></div>
      <div class="events-section-title">SUGERENCIAS</div><div id="suggestGrid" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;"></div>
    `;
    const recentDiv = document.getElementById('recentSearchList');
    if (recentSearches.length === 0) recentDiv.innerHTML = `<div class="empty-events"><p>No hay búsquedas recientes</p></div>`;
    else {
      recentDiv.innerHTML = recentSearches.map(term => `<div class="event-item" style="justify-content:space-between;"><span>✉️ ${escapeHtml(term)}</span><span class="delete-event" data-term="${escapeHtml(term)}">🗑️</span></div>`).join('');
      document.querySelectorAll('[data-term]').forEach(el => {
        el.addEventListener('click', () => {
          const term = el.getAttribute('data-term');
          recentSearches = recentSearches.filter(t => t !== term);
          saveRecent();
          renderSearchPanel();
          showToast('Eliminado');
        });
      });
    }
    const suggestions = ['Buscar por nombre', 'Buscar por email', 'Buscar por área', 'Buscar por empresa', 'Buscar por titulación'];
    const suggestGrid = document.getElementById('suggestGrid');
    suggestGrid.innerHTML = suggestions.map(s => `<div class="suggest-chip" data-suggest="${escapeHtml(s)}">${escapeHtml(s)}</div>`).join('');
    document.querySelectorAll('.suggest-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const txt = chip.innerText;
        document.getElementById('searchInput').value = txt;
        performSearch(txt);
      });
    });
    document.getElementById('searchExecBtn')?.addEventListener('click', () => performSearch(document.getElementById('searchInput').value));
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

  // Navegación
  function setActiveTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(item => {
      if (item.dataset.tab === tab) item.classList.add('active');
      else item.classList.remove('active');
    });
    if (tab === 'calendar') renderCalendarPanel();
    else if (tab === 'areas') renderAreasPanel();
    else if (tab === 'search') renderSearchPanel();
    document.getElementById('fabCreateBtn').style.display = tab === 'calendar' ? 'flex' : 'none';
  }

  function init() {
    loadEvents(); loadAreas(); loadRecent();
    setActiveTab('calendar');
    document.querySelectorAll('.nav-item').forEach(nav => nav.addEventListener('click', () => setActiveTab(nav.dataset.tab)));
    document.getElementById('fabCreateBtn').addEventListener('click', openEventModal);
    document.getElementById('bellContainer').addEventListener('click', toggleNotifications);
    document.getElementById('eventModal').addEventListener('click', (e) => { if (e.target === document.getElementById('eventModal')) closeEventModal(); });
    document.getElementById('areaModal').addEventListener('click', (e) => { if (e.target === document.getElementById('areaModal')) closeAreaModal(); });
  }

  window.createNewEvent = createNewEvent;
  window.closeEventModal = closeEventModal;
  window.openAreaModal = openAreaModal;
  window.closeAreaModal = closeAreaModal;
  window.addNewArea = addNewArea;
  init();
</script>
</body>
</html>
